# Addresses on the Vagrant private network (see deploy/vagrant/*/Vagrantfile).
postgres_ip: 192.168.56.10
history_ip: 192.168.56.11
fetcher_ip: 192.168.56.12
frontend_ip: 192.168.56.13

postgres_port: 5432
history_port: 8081
fetcher_port: 8080

# Dev-only credentials. For anything real: ansible-vault encrypt_string.
db_name: history
db_user: history
db_password: history

overpass_endpoint: https://overpass-api.de/api/interpreter
overpass_retries: 3

# Where deploy/build.sh puts static binaries and where the frontend sources live.
dist_dir: "{{ playbook_dir }}/../dist"
frontend_src: "{{ playbook_dir }}/../../frontend"
