dependencies:
  - role: rust_service
    vars:
      svc_name: overpass-fetcher
      svc_binary: overpass-server
      svc_description: Overpass fetcher HTTP API
      svc_port: "{{ fetcher_port }}"
      svc_env:
        OVERPASS_LISTEN: "0.0.0.0:{{ fetcher_port }}"
        OVERPASS_ENDPOINT: "{{ overpass_endpoint }}"
        OVERPASS_RETRIES: "{{ overpass_retries }}"
        HISTORY_URL: "http://{{ history_ip }}:{{ history_port }}"
