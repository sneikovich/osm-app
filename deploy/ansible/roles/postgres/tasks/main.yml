- name: PostgreSQL server and the Python driver Ansible needs
  ansible.builtin.apt:
    # acl: lets Ansible become the unprivileged postgres user
    name: [postgresql, python3-psycopg2, acl]
    state: present

- name: Running
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started

- name: Listen on the private network
  community.postgresql.postgresql_set:
    name: listen_addresses
    value: "localhost,{{ postgres_ip }}"
  become_user: postgres
  notify: restart postgresql

- name: Locate pg_hba.conf
  community.postgresql.postgresql_query:
    query: SHOW hba_file
  become_user: postgres
  register: hba
  changed_when: false

- name: Allow the history VM (password, scram)
  community.postgresql.postgresql_pg_hba:
    dest: "{{ hba.query_result[0].hba_file }}"
    contype: host
    databases: "{{ db_name }}"
    users: "{{ db_user }}"
    source: "{{ history_ip }}/32"
    method: scram-sha-256
  notify: reload postgresql

- name: Role
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
  become_user: postgres
  no_log: true

- name: Database (schema comes from history's migrations)
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
  become_user: postgres

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Reachable on the private address
  ansible.builtin.wait_for:
    host: "{{ postgres_ip }}"
    port: "{{ postgres_port }}"
    timeout: 30
